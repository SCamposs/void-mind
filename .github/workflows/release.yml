name: Desktop release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag on main
        required: true
        type: string
      verify_only:
        description: Build, sign and verify without publishing or changing the feed
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --prefix .github/signing --ignore-scripts --no-audit --no-fund
      - name: Validate trusted tag and preserve updater identity
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node .github/scripts/release.cjs prepare "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-metadata
          path: metadata/release-metadata.json
          retention-days: 7
          if-no-files-found: error
  windows:
    name: Validate and package Windows without credentials
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install and validate
        working-directory: .
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build unsigned NSIS
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Prepare unsigned Windows artifact
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe -File)
          if ($files.Count -ne 1) { throw "Expected exactly one installer" }
          New-Item -ItemType Directory -Path unsigned -Force | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination unsigned/VOID-Mind-Windows-x64-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows
          path: unsigned/*
          retention-days: 7
          if-no-files-found: error
  linux:
    name: Validate and package Linux without credentials
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Install platform dependencies
        run: sudo apt-get update && sudo apt-get install --yes libayatana-appindicator3-dev libdbus-1-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install and validate
        working-directory: .
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build unsigned Linux packages
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Prepare unsigned Linux artifacts
        run: |
          mkdir unsigned
          shopt -s nullglob
          debs=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          images=(apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#debs[@]}" -eq 1
          test "${#images[@]}" -eq 1
          cp "${debs[0]}" unsigned/VOID-Mind-Linux-x64.deb
          cp "${images[0]}" unsigned/VOID-Mind-Linux-x64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-linux
          path: unsigned/*
          retention-days: 7
          if-no-files-found: error
  sign:
    name: Sign and verify on a fresh runner
    needs: [prepare, windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/signing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install independently locked signing tool without lifecycle scripts or cache
        run: npm ci --prefix .github/signing --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-metadata
          path: metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-windows
          path: unsigned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-linux
          path: unsigned
      - name: Sign fixed package names and verify against the unchanged public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node .github/scripts/release.cjs sign metadata/release-metadata.json unsigned signed
      - name: Verify without signing credentials
        run: node .github/scripts/release.cjs verify metadata/release-metadata.json signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release
          path: signed/*
          retention-days: 7
          if-no-files-found: error
  publish:
    name: Publish verified assets and propose the feed update
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
    needs: [prepare, sign]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/signing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --prefix .github/signing --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-metadata
          path: metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release
          path: signed
      - name: Publish without the signing key; main changes require review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-release.cjs metadata/release-metadata.json signed
