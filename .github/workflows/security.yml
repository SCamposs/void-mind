name: Repository security
on:
  push:
    branches: [main, release-security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Security checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --prefix .github/signing --ignore-scripts --no-audit --no-fund
      - name: Install checksum-pinned detector
        run: |
          mkdir -p "$RUNNER_TEMP/secret-detector"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/secret-detector/tool.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/secret-detector/tool.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/secret-detector/tool.tar.gz" -C "$RUNNER_TEMP/secret-detector" gitleaks
      - name: Scan tracked history including docs and fixtures
        run: '"$RUNNER_TEMP/secret-detector/gitleaks" git --redact --no-banner --log-opts="--all"'
      - name: Check workflows and security regression cases
        env:
          GITLEAKS_PATH: ${{ runner.temp }}/secret-detector/gitleaks
        run: |
          node .github/scripts/check-security.cjs
          node --test .github/scripts/release-security.test.cjs
