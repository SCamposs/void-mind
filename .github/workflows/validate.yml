name: Desktop validation

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'lab/**', 'pyproject.toml', 'uv.lock', '.gitignore']
  pull_request:
    paths-ignore: ['**/*.md', 'lab/**', 'pyproject.toml', 'uv.lock', '.gitignore']
  workflow_dispatch:
    inputs:
      package:
        description: Build downloadable installers without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Validate ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            scrot \
            webkit2gtk-driver \
            xdotool \
            xvfb

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Validate native application
        run: |
          cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build production desktop executable
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle

      - name: Install native Linux test driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: Check first run without a provider
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node scripts/check-desktop-onboarding.mjs

      - name: Preserve native Linux acceptance evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Linux-native-onboarding
          path: private/qa/onboarding-e2e/
          retention-days: 7
          if-no-files-found: ignore

      - name: Bundle Windows installer
        if: github.event_name == 'workflow_dispatch' && inputs.package && runner.os == 'Windows'
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Bundle Linux packages
        if: github.event_name == 'workflow_dispatch' && inputs.package && runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify packaged Linux applications
        if: github.event_name == 'workflow_dispatch' && inputs.package && runner.os == 'Linux'
        run: |
          deb="$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find apps/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          expected_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "$(dpkg-deb --field "$deb" Version)" = "$expected_version"
          test "$(dpkg-deb --field "$deb" Architecture)" = "amd64"
          dpkg-deb --field "$deb" Package Version Architecture Depends
          sha256sum "$deb" "$appimage"

          deb_root="$RUNNER_TEMP/void-mind-deb"
          mkdir -p "$deb_root"
          dpkg-deb --extract "$deb" "$deb_root"
          test -x "$deb_root/usr/bin/void-mind-desktop"
          VOID_MIND_E2E_APP="$deb_root/usr/bin/void-mind-desktop" \
            VOID_MIND_E2E_KIND=deb VOID_MIND_E2E_OUTPUT=private/qa/deb-e2e \
            dbus-run-session -- xvfb-run --auto-servernum node scripts/check-desktop-onboarding.mjs

          appimage_path="$(realpath "$appimage")"
          appimage_root="$RUNNER_TEMP/void-mind-appimage"
          mkdir -p "$appimage_root"
          (cd "$appimage_root" && "$appimage_path" --appimage-extract > /dev/null)
          test -x "$appimage_root/squashfs-root/AppRun"
          VOID_MIND_E2E_APP="$appimage_root/squashfs-root/AppRun" \
            VOID_MIND_E2E_KIND=appimage VOID_MIND_E2E_REDUCED_MOTION=1 \
            VOID_MIND_E2E_OUTPUT=private/qa/appimage-e2e \
            dbus-run-session -- xvfb-run --auto-servernum node scripts/check-desktop-onboarding.mjs

      - name: Preserve packaged Linux acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.package && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Linux-packaged-acceptance
          path: |
            private/qa/deb-e2e/
            private/qa/appimage-e2e/
          retention-days: 7
          if-no-files-found: ignore

      - name: Preserve installable validation packages
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Desktop-packages-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error
