name: Desktop validation

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'lab/**', 'pyproject.toml', 'uv.lock', '.gitignore']
  pull_request:
    paths-ignore: ['**/*.md', 'lab/**', 'pyproject.toml', 'uv.lock', '.gitignore']
  workflow_dispatch:
    inputs:
      package:
        description: Build downloadable installers without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Validate ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Validate native application
        run: |
          cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build production desktop executable
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle

      - name: Install native Linux test driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: Check first run without a provider
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node scripts/check-desktop-onboarding.mjs

      - name: Preserve native Linux acceptance evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Linux-native-onboarding
          path: private/qa/onboarding-e2e/
          if-no-files-found: ignore

      - name: Bundle Windows installer
        if: github.event_name == 'workflow_dispatch' && inputs.package && runner.os == 'Windows'
        working-directory: apps/desktop
        run: npm run tauri -- bundle --bundles nsis

      - name: Bundle Linux packages
        if: github.event_name == 'workflow_dispatch' && inputs.package && runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm run tauri -- bundle --bundles deb,appimage

      - name: Preserve installable validation packages
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: Desktop-packages-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
