[project]
name = "void-mind"
version = "0.1.0"
description = "Local model lab for VOID Mind datasets, evaluation, manifests, and reproducible training workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "SCamposs" }]
dependencies = [
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.8,<2",
  "datasets>=3.6,<5",
  "peft>=0.15,<1",
  "transformers>=4.52,<6",
  "trl>=0.18,<1",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
mind = "void_mind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/void_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
